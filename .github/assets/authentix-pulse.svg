<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050812"/>
      <stop offset="0.48" stop-color="#071827"/>
      <stop offset="1" stop-color="#04120F"/>
    </linearGradient>
    <linearGradient id="neon" x1="265" y1="0" x2="935" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36E1CC"/>
      <stop offset="0.5" stop-color="#20B8FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="translate(600 188) rotate(90) scale(150 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20B8FF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#20B8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#25D8C2" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="phoneClip"><rect x="519" y="53" width="162" height="254" rx="26"/></clipPath>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="600" cy="188" rx="420" ry="150" fill="url(#orb)"/>

  <g opacity="0.7">
    <path d="M0 88H310L344 122H449" stroke="#36E1CC" stroke-opacity="0.2"/>
    <path d="M1200 88H890L856 122H751" stroke="#20B8FF" stroke-opacity="0.2"/>
    <path d="M0 270H270L306 234H450" stroke="#20B8FF" stroke-opacity="0.16"/>
    <path d="M1200 270H930L894 234H750" stroke="#7C5CFF" stroke-opacity="0.16"/>
  </g>

  <g filter="url(#glow)">
    <rect x="511" y="45" width="178" height="270" rx="31" stroke="url(#neon)" stroke-width="2.5"/>
    <rect x="524" y="58" width="152" height="244" rx="22" fill="#07101A" stroke="#36E1CC" stroke-opacity="0.22"/>
    <rect x="574" y="64" width="52" height="5" rx="2.5" fill="#36E1CC" fill-opacity="0.55"/>
  </g>

  <g clip-path="url(#phoneClip)">
    <rect x="526" y="80" width="148" height="204" fill="#061019"/>
    <g opacity="0.92">
      <circle cx="600" cy="177" r="57" stroke="#36E1CC" stroke-width="1.6" stroke-dasharray="5 8">
        <animateTransform attributeName="transform" type="rotate" from="0 600 177" to="360 600 177" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="177" r="43" stroke="#20B8FF" stroke-width="1.4" stroke-dasharray="20 8">
        <animateTransform attributeName="transform" type="rotate" from="360 600 177" to="0 600 177" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="177" r="26" fill="#36E1CC" fill-opacity="0.05" stroke="#36E1CC" stroke-opacity="0.45"/>
      <path d="M584 177L595 188L617 165" stroke="#36E1CC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="526" y="82" width="148" height="3" fill="#36E1CC" filter="url(#glow)" opacity="0.9">
      <animate attributeName="y" values="82;278;82" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0.85">
      <rect x="548" y="247" width="104" height="7" rx="3.5" fill="#0E2930"/>
      <rect x="548" y="247" width="82" height="7" rx="3.5" fill="url(#neon)">
        <animate attributeName="width" values="18;82;60;104;82" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="600" y="270" fill="#7E9AA8" font-family="monospace" font-size="9" text-anchor="middle">DIAGNOSTIC SIGNAL ACTIVE</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="250" y="142" fill="#F4F8FC" font-size="52" font-weight="800" letter-spacing="8">AUTHENTI</text>
    <text x="436" y="142" fill="#36E1CC" font-size="52" font-weight="800" opacity="0">X</text>
    <text x="950" y="142" fill="#F4F8FC" font-size="52" font-weight="800" text-anchor="end" letter-spacing="8">X</text>
    <text x="250" y="177" fill="#6E8B99" font-size="13" font-weight="600" letter-spacing="4">MOBILE HEALTH • RELIABILITY • TRUST</text>
    <text x="950" y="177" fill="#6E8B99" font-size="13" font-weight="600" text-anchor="end" letter-spacing="3">INSPECT • SCORE • VERIFY</text>
  </g>

  <g font-family="monospace" font-size="11">
    <g transform="translate(120 218)">
      <circle cx="6" cy="6" r="5" fill="#36E1CC"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="22" y="10" fill="#8CA6B3">CAMERA / DISPLAY / TOUCH</text>
    </g>
    <g transform="translate(120 246)">
      <circle cx="6" cy="6" r="5" fill="#20B8FF"><animate attributeName="opacity" values="1;0.25;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <text x="22" y="10" fill="#8CA6B3">BATTERY / STORAGE / CONNECTIVITY</text>
    </g>
    <g transform="translate(794 218)">
      <circle cx="6" cy="6" r="5" fill="#7C5CFF"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.3s" repeatCount="indefinite"/></circle>
      <text x="22" y="10" fill="#8CA6B3">TRUST SCORE 0—100</text>
    </g>
    <g transform="translate(794 246)">
      <circle cx="6" cy="6" r="5" fill="#36E1CC"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="22" y="10" fill="#8CA6B3">QR-VERIFIED REPORTS</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="23" stroke="url(#neon)" stroke-opacity="0.25"/>
</svg>