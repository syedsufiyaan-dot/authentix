<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050812"/>
      <stop offset="0.5" stop-color="#071827"/>
      <stop offset="1" stop-color="#04120F"/>
    </linearGradient>
    <linearGradient id="neon" x1="420" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36E1CC"/>
      <stop offset="0.52" stop-color="#20B8FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#25D8C2" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="phoneClip"><rect x="526" y="123" width="148" height="180" rx="22"/></clipPath>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="68" fill="#F4F8FC" font-size="50" font-weight="800" letter-spacing="9">AUTHENTI<tspan fill="#36E1CC">X</tspan></text>
    <text x="600" y="98" fill="#7E9AA8" font-size="13" font-weight="600" letter-spacing="4">MOBILE HEALTH • RELIABILITY • TRUST</text>
  </g>

  <g opacity="0.7">
    <path d="M80 170H350L405 215H485" stroke="#36E1CC" stroke-opacity="0.22"/>
    <path d="M1120 170H850L795 215H715" stroke="#20B8FF" stroke-opacity="0.22"/>
    <path d="M80 280H320L380 245H485" stroke="#20B8FF" stroke-opacity="0.16"/>
    <path d="M1120 280H880L820 245H715" stroke="#7C5CFF" stroke-opacity="0.16"/>
  </g>

  <g filter="url(#glow)">
    <rect x="511" y="113" width="178" height="210" rx="31" stroke="url(#neon)" stroke-width="2.5"/>
    <rect x="524" y="121" width="152" height="194" rx="22" fill="#07101A" stroke="#36E1CC" stroke-opacity="0.22"/>
    <rect x="574" y="128" width="52" height="5" rx="2.5" fill="#36E1CC" fill-opacity="0.55"/>
  </g>

  <g clip-path="url(#phoneClip)">
    <rect x="526" y="136" width="148" height="164" fill="#061019"/>
    <circle cx="600" cy="210" r="50" stroke="#36E1CC" stroke-width="1.6" stroke-dasharray="5 8">
      <animateTransform attributeName="transform" type="rotate" from="0 600 210" to="360 600 210" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="210" r="36" stroke="#20B8FF" stroke-width="1.4" stroke-dasharray="18 8">
      <animateTransform attributeName="transform" type="rotate" from="360 600 210" to="0 600 210" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="210" r="22" fill="#36E1CC" fill-opacity="0.05" stroke="#36E1CC" stroke-opacity="0.45"/>
    <path d="M587 210L597 220L615 198" stroke="#36E1CC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="526" y="138" width="148" height="3" fill="#36E1CC" filter="url(#glow)" opacity="0.9">
      <animate attributeName="y" values="138;290;138" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="monospace" font-size="11">
    <g transform="translate(145 196)">
      <circle cx="6" cy="6" r="5" fill="#36E1CC"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="22" y="10" fill="#8CA6B3">CAMERA / DISPLAY / TOUCH</text>
    </g>
    <g transform="translate(145 230)">
      <circle cx="6" cy="6" r="5" fill="#20B8FF"><animate attributeName="opacity" values="1;0.25;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <text x="22" y="10" fill="#8CA6B3">BATTERY / STORAGE / CONNECTIVITY</text>
    </g>
    <g transform="translate(790 196)">
      <circle cx="6" cy="6" r="5" fill="#7C5CFF"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.3s" repeatCount="indefinite"/></circle>
      <text x="22" y="10" fill="#8CA6B3">TRUST SCORE 0–100</text>
    </g>
    <g transform="translate(790 230)">
      <circle cx="6" cy="6" r="5" fill="#36E1CC"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="22" y="10" fill="#8CA6B3">QR-VERIFIED REPORTS</text>
    </g>
  </g>

  <g font-family="monospace" text-anchor="middle">
    <text x="600" y="344" fill="#6E8B99" font-size="10" letter-spacing="2.5">INSPECT • SCORE • VERIFY</text>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="23" stroke="url(#neon)" stroke-opacity="0.25"/>
</svg>